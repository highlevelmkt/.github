<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<title>High Level Marketing (HLM) — sites, SEO local e anúncios para pequenas empresas</title>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#2a2a2e" stroke-width="1" opacity=".55"/></pattern>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e1551c" stop-opacity=".35"/><stop offset="1" stop-color="#e1551c" stop-opacity="0"/></radialGradient>
<linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#e1551c" stop-opacity="0"/><stop offset=".5" stop-color="#e1551c" stop-opacity=".9"/><stop offset="1" stop-color="#e1551c" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="360" rx="18"/></clipPath>
</defs>
<style>
.ring{transform-origin:965px 150px;animation:p 3.6s cubic-bezier(.2,.7,.3,1) infinite;opacity:0}
.r2{animation-delay:1.2s}.r3{animation-delay:2.4s}
@keyframes p{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.scan{animation:s 6s linear infinite}
@keyframes s{0%{transform:translateX(-400px)}100%{transform:translateX(1300px)}}
.blink{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ring,.scan,.blink{animation:none}.ring{opacity:.35}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="360" fill="#0a0a0a"/>
<rect width="1200" height="360" fill="url(#g)"/>
<circle cx="965" cy="150" r="190" fill="url(#glow)"/>
<rect class="scan" y="0" width="260" height="2" fill="url(#scan)"/>
<text x="60" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8d8d93">HIGHLEVELMKT <tspan fill="#e1551c">/</tspan> PORTUGAL <tspan fill="#e1551c">·</tspan> DESDE 2021</text>
<text x="56" y="160" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800" font-size="92" letter-spacing="-3" fill="#f5f5f0">HIGH LEVEL</text>
<text x="56" y="238" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800" font-size="92" letter-spacing="-3" fill="none" stroke="#e1551c" stroke-width="2">MARKETING<tspan class="blink" fill="#e1551c" stroke="none">_</tspan></text>
<g transform="translate(60 292)"><rect width="146" height="30" rx="15" fill="none" stroke="#2a2a2e"/><text x="73" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1" fill="#f5f5f0">SITES À MEDIDA</text></g><g transform="translate(216 292)"><rect width="104" height="30" rx="15" fill="none" stroke="#2a2a2e"/><text x="52" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1" fill="#f5f5f0">SEO LOCAL</text></g><g transform="translate(329 292)"><rect width="255" height="30" rx="15" fill="none" stroke="#2a2a2e"/><text x="127" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1" fill="#f5f5f0">PERFIL DA EMPRESA NO GOOGLE</text></g><g transform="translate(594 292)"><rect width="112" height="30" rx="15" fill="none" stroke="#2a2a2e"/><text x="56" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1" fill="#f5f5f0">GOOGLE ADS</text></g><g transform="translate(716 292)"><rect width="95" height="30" rx="15" fill="none" stroke="#2a2a2e"/><text x="48" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1" fill="#f5f5f0">META ADS</text></g><g transform="translate(821 292)"><rect width="137" height="30" rx="15" fill="none" stroke="#2a2a2e"/><text x="69" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1" fill="#f5f5f0">DADOS ABERTOS</text></g>
<g>
<circle class="ring" cx="965" cy="150" r="80" fill="none" stroke="#e1551c" stroke-width="2"/>
<circle class="ring r2" cx="965" cy="150" r="80" fill="none" stroke="#e1551c" stroke-width="2"/>
<circle class="ring r3" cx="965" cy="150" r="80" fill="none" stroke="#e1551c" stroke-width="2"/>
<path d="M965 96c-24 0-42 18-42 41 0 31 42 72 42 72s42-41 42-72c0-23-18-41-42-41z" fill="#e1551c"/>
<circle cx="965" cy="137" r="15" fill="#0a0a0a"/>
<text x="965" y="250" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#8d8d93">A SUA EMPRESA, ENCONTRADA</text>
</g>
<rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#2a2a2e"/>
</g>
</svg>