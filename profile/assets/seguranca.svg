<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<title>HLM Shield: cabeçalhos de segurança, vigia de uptime, domínio, SSL e DNS, correções de dependências, auditorias e RGPD</title>
