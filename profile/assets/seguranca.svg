<style>.ln{opacity:0;animation:in .25s steps(2) forwards}@keyframes in{to{opacity:1}}
.px{opacity:0;animation:pin .4s ease-out forwards,sh 3.2s ease-in-out infinite}
@keyframes pin{from{opacity:0}to{opacity:1}}@keyframes sh{0%,100%{opacity:1}50%{opacity:.6}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style>
