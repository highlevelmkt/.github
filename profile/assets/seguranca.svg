<text class="ln" style="animation-delay:0.40s" x="40" y="116" font-family="'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f4f4f5" xml:space="preserve"><tspan fill="#c27aff">✔</tspan> cabeçalhos HTTP      <tspan fill="#8b8b94">CSP, HSTS e outros, em cada site</tspan></text><text class="ln" style="animation-delay:0.70s" x="40" y="154" font-family="'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f4f4f5" xml:space="preserve"><tspan fill="#c27aff">✔</tspan> uptime               <tspan fill="#8b8b94">vigia do site com alerta</tspan></text><text class="ln" style="animation-delay:1.00s" x="40" y="192" font-family="'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f4f4f5" xml:space="preserve"><tspan fill="#c27aff">✔</tspan> domínio · SSL · DNS  <tspan fill="#8b8b94">verificação todos os dias</tspan></text><text class="ln" style="animation-delay:1.30s" x="40" y="230" font-family="'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f4f4f5" xml:space="preserve"><tspan fill="#c27aff">✔</tspan> dependências         <tspan fill="#8b8b94">correções de segurança aplicadas por nós</tspan></text><text class="ln" style="animation-delay:1.60s" x="40" y="268" font-family="'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f4f4f5" xml:space="preserve"><tspan fill="#c27aff">✔</tspan> auditorias           <tspan fill="#8b8b94">sites, APIs, logins e permissões</tspan></text><text class="ln" style="animation-delay:1.90s" x="40" y="306" font-family="'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f4f4f5" xml:space="preserve"><tspan fill="#c27aff">✔</tspan> RGPD                 <tspan fill="#8b8b94">consentimento de cookies e dados mínimos</tspan></text>
