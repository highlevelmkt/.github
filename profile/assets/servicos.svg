<text x="24" y="104" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#8d8d93">Páginas por serviço e por zona, Search Console.</text></g><g transform="translate(800 20)"><rect width="370" height="130" rx="12" fill="#141416" stroke="#2a2a2e"/>
